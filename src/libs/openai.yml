openapi: 3.1.0
x-stoplight:
  id: 7g4jnccse6623
info:
  title: Bill Vending Services
  version: '1.0'
  summary: 'Perform Operations such as Purchase and Sales of Airtime, Data, TV and Power Services.'
  description: "NOTES:\r\n\r\nget providers, \r\nvalidate(initiate purchase process), \r\nvend(confirm purchase process), \r\nrequery(retry a failed transaction)\r\n"
servers:
  - url: 'https://staging.airtime-data.irechargetech.com/api/v2'
    description: Airtime-Data Server
  - url: 'https://staging.power.irechargetech.com/api/v2'
    description: Power Service Server
  - url: 'https://staging.tv.irechargetech.com/api/v2'
    description: TV Service Server
  - url: 'https://dev.power.irechargetech.com/api/v2'
    description: Dev Power Server
  - url: 'https://dev.airtime-data.irechargetech.com/api/v2'
    description: Dev Airtime-Data Server
  - url: 'https://dev.tv.irechargetech.com/api/v2/'
    description: Dev TV Server
  - url: ''
    description: ''
paths:
  /merchant/airtime/providers:
    get:
      summary: /merchant/airtime/providers
      servers:
        - url: 'https://dev.airtime-data.irechargetech.com/api/v2'
          description: Airtime-Data Server
      responses:
        '200':
          description: |
            This signifies a successful request. Here's an example response body:
            ```json
            {
              "status": "OK",
              "code": "00",
              "message": "Successful",
              "data": [
                { "name": "MTN" },
                { "name": "GLO" },
                { "name": "9MOBILE" },
                { "name": "AIRTEL" },
                { "name": "SMILE" },
                { "name": "SPECTRANET" }
              ]
            }
            ```
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  Example 1:
                    status: OK
                    code: '00'
                    message: Successful
                    data:
                      - name: MTN
                      - name: GLO
                      - name: MOBILE
                properties:
                  status:
                    type: string
                    description: The status of your request.
                  code:
                    type: string
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: The airtime service provider's name.
              examples:
                Successful response:
                  value:
                    status: OK
                    code: '00'
                    message: Successful
                    data:
                      - name: MTN
                      - name: GLO
        '401':
          $ref: '#/components/responses/401'
        5XX:
          $ref: '#/components/responses/500'
      operationId: get-airtime-providers
      x-stoplight:
        id: 4go2vslgui3mr
      description: Returns a list of all the supported airtime providers. Accelerate currently supports 6 airtime providers.
      tags:
        - Airtime Service
    parameters: []
  /merchant/airtime/validate:
    post:
      summary: /merchant/airtime/validate
      responses:
        '200':
          description: "This signifies a successful request. Here's an example response body:\r\n```json\r\n{\r\n    \"status\": \"OK\",\r\n    \"code\": \"00\",\r\n    \"message\": \"Successful\",\r\n    \"data\": {\r\n        \"validation_reference\": \"2024090916044696028525\",\r\n        \"receiver\": \"+2347030000000\",\r\n        \"provider\": \"MTN\",\r\n        \"transaction_date\": \"09/09/2024, 17:04:27\",\r\n        \"amount\": \"100\",\r\n     \"status\": \"fulfilled\"\r\n    }\r\n}\r\n```"
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  Example 1:
                    status: OK
                    code: '00'
                    message: Successful
                    data:
                      validation_reference: '2024090916044696028525'
                      receiver: '+2347030000000'
                      provider: MTN
                      transaction_date: '09/09/2024, 17:04:27'
                      amount: '100'
                      status: fulfilled
                properties:
                  status:
                    type: string
                    description: The status of your request.
                  code:
                    type: string
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      validation_reference:
                        type: string
                        description: Unique set of numbers to validate your transaction when you call `merchant/airtime/vend`
                      receiver:
                        type: string
                        description: The phone number of the airtime receiver.
                      provider:
                        type: string
                        description: The name of the airtime service provider.
                      transaction_date:
                        type: string
                        description: The date and time of the transaction.
                      amount:
                        type: string
                        description: The amount of airtime to purchase.
                      status:
                        type: string
                        description: The status of your transaction. Can either be fulfilled or failed.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        5XX:
          $ref: '#/components/responses/500'
      operationId: post-airtime
      x-stoplight:
        id: ibvrj4u5jixv0
      description: Use this endpoint to initiate a request to purchase airtime.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              x-examples:
                Example 1:
                  provider: MTN
                  amount: 100
                  receiver: '+2347030000000'
              required:
                - provider
                - amount
                - receiver
              properties:
                provider:
                  type: string
                  description: Airtime provider. Get list of airtime providers from `merchant/airtime/providers`
                amount:
                  type: integer
                  description: Amount of airtime to purchase.
                receiver:
                  type: string
                  description: Phone number of airtime receiver.
            examples:
              Example Request:
                value:
                  provider: MTN
                  amount: 100
                  receiver: '+2347030000000'
        description: "**Example Request Body**:\r\n\r\n```json\r\n{\r\n  \"provider\": \"MTN\",\r\n  \"amount\": 100,\r\n  \"receiver\": \"+2347030000000\",\r\n}\r\n```"
      tags:
        - Airtime Service
    parameters: []
  /merchant/airtime/vend:
    post:
      summary: /merchant/airtime/vend
      responses:
        '200':
          description: "This signifies a successful request. Here's an example response body:\r\n```json\r\n{\r\n    \"status\": \"OK\",\r\n    \"code\": \"00\",\r\n    \"message\": \"Successful\",\r\n    \"data\": {\r\n        \"amount\": \"100\",\r\n        \"receiver\": \"+2349010987600\",\r\n        \"wallet_balance\": 499400,\r\n        \"payment_reference\": \"56a345c6-f019-44b8-8ec7-a0a9eebf4830\",\r\n        \"transaction_reference\": \"2024061621122460872263\",\r\n        \"status\": \"fulfilled\",\r\n        \"transaction_date\": \"2024-06-16 21:12:13\",\r\n        \"provider\": \"AIRTEL\",\r\n           }\r\n}\r\n```"
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  Example 1:
                    status: OK
                    code: '00'
                    message: Successful
                    data:
                      amount: '100'
                      receiver: '+2349010987600'
                      wallet_balance: 499400
                      payment_reference: 56a345c6-f019-44b8-8ec7-a0a9eebf4830
                      transaction_reference: '2024061621122460872263'
                      status: fulfilled
                      transaction_date: '2024-06-16 21:12:13'
                      provider: AIRTEL 
                properties:
                  status:
                    type: string
                    description: Your request's status.
                  code:
                    type: string
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      amount:
                        type: string
                        description: The amoount of airtime purchased.
                      receiver:
                        type: string
                        description: Phone number of the airtime receiver.
                      wallet_balance:
                        type: integer
                        description: The amount of money left in your waet after a successful transaction.
                      payment_reference:
                        type: string
                        description: Unique set of digits and characters to identify your transaction.
                      transaction_reference:
                        type: string
                        description: Your unique transaction reference.
                      status:
                        type: string
                        description: The status of your transaction. Can either be fulfilled or failed.
                      transaction_date:
                        type: string
                        description: The date and time of your transaction.
                      provider:
                        type: string
                        description: The airtime service provider. 
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        5XX:
          $ref: '#/components/responses/500'
      operationId: post-airtime-vend
      x-stoplight:
        id: lqc01j5azg95u
      requestBody:
        content:
          application/json:
            schema:
              type: object
              x-examples:
                Example 1:
                  validation_reference: '240220219087'
                  transaction_reference: '240220219087'
              required:
                - validation_reference
                - transaction_reference
              properties:
                validation_reference:
                  type: string
                  description: Validation reference for the current transaction. Get the validation reference from `airtime/validate`.
                transaction_reference:
                  type: string
                  description: Unique set of digits to identify a transaction.
            examples:
              Example 1:
                value:
                  validation_reference: '240220219087'
                  transaction_reference: '240220219087'
        description: "**Example Request Body**\r\n\r\n```json\r\n{\r\n  \"pin\": \"271998\",\r\n  \"validation_reference\": \"20240612105814544002\",\r\n  \"transaction_reference\":\"240220219087\"\r\n}\r\n```"
      description: 'Use the `merchant/airtime/vend/` endpoint to complete an airtime transaction.<br>Call this endpoint after you initiate a transaction with the [`merchant/airtime/validate/`](https://accelerate.stoplight.io/docs/accelerate/ibvrj4u5jixv0-airtime-validate) endpoint. <br>'
      tags:
        - Airtime Service
    parameters: []
  /merchant/airtime/requery:
    get:
      summary: /merchant/airtime/requery
      responses:
        '200':
          description: "This signifies a successful request. Here's an example response body:\r\n```json\r\n{\r\n    \"status\": \"OK\",\r\n    \"code\": \"00\",\r\n    \"message\": \"Success\",\r\n    \"data\": {\r\n        \"provider\": \"AIRTEL\",\r\n        \"amount\": \"100\",\r\n        \"receiver\": \"+2349010987600\",\r\n        \"payment_reference\": \"56a345c6-f019-44b8-8ec7-a0a9eebf4830\",\r\n        \"transaction_reference\": \"240220219087\",\r\n        \"status\": \"fulfilled\",\r\n        \"transaction_date\": \"2024-06-16 21:12:13\"\r\n    }\r\n}\r\n```"
