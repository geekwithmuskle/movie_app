                      transaction_reference: '240220219087'
                      status: fulfilled
                      transaction_date: '2024-06-16 21:12:13'
                properties:
                  status:
                    type: string
                    description: The status of your request.
                  code:
                    type: string
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      provider:
                        type: string
                        description: 'The airtime provider. For example, "MTN".'
                      amount:
                        type: string
                        description: The amount of airtime purchased in the transaction.
                      receiver:
                        type: string
                        description: The phone number of the airtime receiver.
                      payment_reference:
                        type: string
                        description: Unique set of digits and characters to identify your transaction.
                      transaction_reference:
                        type: string
                        description: Your unique transaction reference.
                      status:
                        type: string
                        description: The status of the transaction Can either be fulfilled or failed.
                      transaction_date:
                        type: string
                        description: The date and time of the transaction.
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        5XX:
          $ref: '#/components/responses/500'
      operationId: get-airtime-requery
      x-stoplight:
        id: 4n0l3280uury9
      description: "Use the `/airtime/requery/` endpoint to get information about a previous transaction. You can get information such as the payment reference or the status of the transaction.\r\n<br>You should initiate the requery by sending the client's unique transaction reference as a query parameter."
      parameters:
        - schema:
            type: string
          in: query
          name: transaction_reference
          description: Client's unique transaction reference.
          required: true
      requestBody:
        content: {}
        description: This endpoint does not have any request body.
      tags:
        - Airtime Service
    parameters: []
